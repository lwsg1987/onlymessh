# /etc/onlymessh/config.toml
#
# 要跟踪的域名：它的解析结果会变成防火墙白名单。
domain = "example.com"

# 检测间隔（秒），600 = 10 分钟。
interval = 600

# 0 = v4 + v6，4 = 只 IPv4，6 = 只 IPv6。
ip_version = 0

# 永不删除的地址 / CIDR（跳板机、备用入口等）。
# 注意：当前 SSH 会话的来源地址不需要写在这里，程序会自己保住。
keep = []

# 单次解析超时（秒）。超时后本轮不改防火墙。
dns_timeout = 10.0

# 单次 ufw 调用的超时（秒）。iptables 卡住时不至于让同步循环永久冻结。
ufw_timeout = 60.0