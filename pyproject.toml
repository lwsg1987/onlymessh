[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onlymessh"
version = "0.1.0"
description = "onlymessh"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
onlymessh = "onlymessh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/onlymessh"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
